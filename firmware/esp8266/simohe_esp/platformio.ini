; PlatformIO project — SIMOHE ESP8266
; Compile: pio run -e esp
; Test logika (host): pio test -e native

[platformio]
default_envs = esp

[env:esp]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../common
lib_deps =
    bblanchon/ArduinoJson@^6.21.5

[env:native]
platform = native
test_framework = unity
lib_extra_dirs = ../../common
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
build_flags = -std=gnu++17 -Wall -Wextra
