services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: simohe-server:latest
    container_name: simohe-server
    restart: always
    # MySQL jalan langsung di host (127.0.0.1:3306). Container memakai jaringan
    # host agar dapat menjangkau MySQL lokal tanpa mengubah bind-address MySQL.
    network_mode: host
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:'+(process.env.PORT||'3000')+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
