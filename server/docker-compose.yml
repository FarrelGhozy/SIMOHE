services:
  mysql:
    image: mysql:8.4
    container_name: simohe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-simohe_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-simohe}
      MYSQL_USER: ${MYSQL_USER:-simohe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-simohe}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - simohe_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  simohe_mysql_data:
